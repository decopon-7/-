<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5f4a">
  <title>ほいくつなぐ 午睡チェック</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-name">ほいくつなぐ</span>
      <span class="brand-sub">午睡チェック</span>
    </div>
    <div class="top-right">
      <span id="clock" class="clock"></span>
      <button id="staffBtn" class="staff-chip" type="button"></button>
    </div>
  </header>

  <div class="trial">試作版です。実在の園児の情報は入力しないでください（データはこの端末の中だけに保存されます）</div>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="check" class="tab">チェック</button>
    <button type="button" role="tab" data-tab="record" class="tab">記録</button>
    <button type="button" role="tab" data-tab="settings" class="tab">設定</button>
  </nav>

  <div id="classBar" class="class-bar"></div>

  <main id="view"></main>

  <dialog id="dialog">
    <form method="dialog" id="dialogBody"></form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
