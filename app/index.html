<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5f4a">
  <title>ほいくつなぐ 保育士用</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="loginView" class="login" hidden>
    <div class="login-card">
      <div class="login-brand">
        <span class="login-name">ほいくつなぐ</span>
        <span class="login-sub">保育士用</span>
      </div>
      <p class="login-lead">この端末を園の端末として登録します。登録は最初の1回だけで、職員は名前を選ぶだけで使えます。</p>
      <form id="loginForm" class="login-form">
        <label>管理者のログインID
          <input name="loginId" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </label>
        <label>パスワード
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <label>この端末の名前
          <input name="deviceName" placeholder="例：0歳児室のタブレット" maxlength="20" required>
        </label>
        <p id="loginError" class="error" hidden></p>
        <button class="btn primary big" type="submit">この端末を登録する</button>
      </form>
      <p id="loginNote" class="login-note" hidden></p>
      <button id="demoBtn" class="btn ghost" type="button" hidden>デモで試す（サンプルデータ）</button>
    </div>
  </section>

  <div id="appView" hidden>
    <header class="top">
      <div class="brand">
        <span class="brand-name">ほいくつなぐ</span>
        <span class="brand-sub">保育士用</span>
      </div>
      <div class="top-right">
        <span id="clock" class="clock"></span>
        <button id="staffBtn" class="staff-chip" type="button"></button>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>

    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="check" class="tab">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5Z"/></svg>
        <span>午睡</span>
      </button>
      <button type="button" role="tab" data-tab="meal" class="tab">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v7a3 3 0 0 0 3 3v8M8 3v10M11 3v10M17 3c-1.7 0-3 2-3 5s1.3 5 3 5M17 3v18"/></svg>
        <span>給食</span>
      </button>
      <button type="button" role="tab" data-tab="record" class="tab">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h10a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z"/><path d="M9 3v2h6V3M8.5 11h7M8.5 15h7"/></svg>
        <span>記録</span>
      </button>
      <button type="button" role="tab" data-tab="settings" class="tab">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2.1-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2.1 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9c.6.5 1.3.9 2.1 1.2L10 21h4l.5-2.6a7 7 0 0 0 2.1-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2Z"/></svg>
        <span>設定</span>
      </button>
    </nav>

    <div id="classBar" class="class-bar"></div>

    <main id="view"></main>
  </div>

  <dialog id="dialog">
    <form method="dialog" id="dialogBody"></form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
