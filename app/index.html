<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5f4a">
  <title>ほいくつなぐ 午睡チェック</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="loginView" class="login" hidden>
    <div class="login-card">
      <div class="login-brand">
        <span class="login-name">ほいくつなぐ</span>
        <span class="login-sub">午睡チェック</span>
      </div>
      <p class="login-lead">この端末を園の端末として登録します。登録は最初の1回だけで、職員は名前を選ぶだけで使えます。</p>
      <form id="loginForm" class="login-form">
        <label>管理者のログインID
          <input name="loginId" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </label>
        <label>パスワード
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <label>この端末の名前
          <input name="deviceName" placeholder="例：0歳児室のタブレット" maxlength="20" required>
        </label>
        <p id="loginError" class="error" hidden></p>
        <button class="btn primary big" type="submit">この端末を登録する</button>
      </form>
      <p id="loginNote" class="login-note" hidden></p>
      <button id="demoBtn" class="btn ghost" type="button" hidden>デモで試す（サンプルデータ）</button>
    </div>
  </section>

  <div id="appView" hidden>
    <header class="top">
      <div class="brand">
        <span class="brand-name">ほいくつなぐ</span>
        <span class="brand-sub">午睡チェック</span>
      </div>
      <div class="top-right">
        <span id="clock" class="clock"></span>
        <button id="staffBtn" class="staff-chip" type="button"></button>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>

    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="check" class="tab">チェック</button>
      <button type="button" role="tab" data-tab="record" class="tab">記録</button>
      <button type="button" role="tab" data-tab="settings" class="tab">設定</button>
    </nav>

    <div id="classBar" class="class-bar"></div>

    <main id="view"></main>
  </div>

  <dialog id="dialog">
    <form method="dialog" id="dialogBody"></form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
