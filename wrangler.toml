name = "hoiku-tsunagu"
main = "worker/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./app"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "hoiku-tsunagu"
# `npx wrangler d1 create hoiku-tsunagu` で表示される database_id に書き換える
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
